name: Deploy To EKS

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string

      aws_role_to_assume:
        required: true
        type: string

      eks_cluster_name:
        required: true
        type: string

      deployment_configs_ref:
        description: "Branch or tag of deployment-configs repository"
        required: false
        type: string
        default: ""

      kubernetes_namespace:
        required: true
        type: string

      helm_release_name:
        description: "Helm release name"
        required: true
        type: string
        default: 

      helm_chart_path:
        description: "Helm chart path inside deployment-configs repository"
        required: true
        type: string
        default: ""

      helm_values_file:
        description: "Helm values file"
        required: true
        type: string
        default: ""

      # --- New Toggle Inputs for AWS vs Custom Kubeconfig ---
      use_aws_auth:
        description: "Set to true to use AWS IAM role authentication"
        required: false
        type: boolean
        default: true

      use_custom_kubeconfig:
        description: "Set to true to use a custom kubeconfig file on the runner"
        required: false
        type: boolean
        default: false

      kubeconfig_path:
        description: "Path to the custom kubeconfig file if use_custom_kubeconfig is true"
        required: false
        type: string
        default: ""

    secrets:
      discord_webhook:
        required: false

      deployment_configs_token:
        description: "GitHub token to checkout deployment-configs repository if private"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy To EKS
    runs-on: [self-hosted, linux, x64, aws]

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAGING_BUILDS_URL }}

    steps:

      # ---------------------------------------------------------
      # Checkout deployment-configs repository
      # ---------------------------------------------------------
      - name: Checkout deployment configs
        uses: actions/checkout@v4
        with:
          repository: ooru-digital/deployment-configs
          ref: ${{ inputs.deployment_configs_ref }}
          path: deployment-configs
          token: ${{ secrets.deployment_configs_token || github.token }}

      # ---------------------------------------------------------
      # Show deployment location
      # ---------------------------------------------------------
      - name: Explain deploy execution location
        run: |
          echo "Deployment job is running on GitHub self-hosted runner."
          echo "AWS, kubectl and Helm commands execute directly from this runner."

      # ---------------------------------------------------------
      # Configure AWS credentials
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        if: ${{ inputs.use_aws_auth == true }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          role-chaining: true
      # ---------------------------------------------------------
      # Install kubectl
      # ---------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ---------------------------------------------------------
      # Install Helm
      # ---------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ---------------------------------------------------------
      # Configure kubeconfig
      # ---------------------------------------------------------
      - name: Configure Kubeconfig (AWS vs Custom)
        run: |
          if [ "${{ inputs.use_custom_kubeconfig }}" = "true" ]; then
            if [ -z "${{ inputs.kubeconfig_path }}" ]; then
              echo "::error::use_custom_kubeconfig is true, but kubeconfig_path is empty!"
              exit 1
            fi
            echo "Using custom kubeconfig path: ${{ inputs.kubeconfig_path }}"
            echo "KUBECONFIG=${{ inputs.kubeconfig_path }}" >> $GITHUB_ENV
          elif [ "${{ inputs.use_aws_auth }}" = "true" ]; then
            if [ -z "${{ inputs.aws_region }}" ] || [ -z "${{ inputs.eks_cluster_name }}" ]; then
              echo "::error::aws_region and eks_cluster_name are required when use_aws_auth is true!"
              exit 1
            fi
            echo "Using AWS IAM role and updating kubeconfig via aws eks update-kubeconfig..."
            aws eks update-kubeconfig \
              --name "${{ inputs.eks_cluster_name }}" \
              --region "${{ inputs.aws_region }}"
          else
            echo "::error::Neither AWS auth nor custom kubeconfig was selected!"
            exit 1
          fi

      # ---------------------------------------------------------
      # Verify EKS access
      # ---------------------------------------------------------
      - name: Verify cluster access
        id: verify_cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      # ---------------------------------------------------------
      # EKS access failure notification
      # ---------------------------------------------------------
      - name: Send EKS Access Failed Alert
        if: ${{ failure() && steps.verify_cluster.outcome == 'failure' && env.DISCORD_WEBHOOK != '' }}
        run: |
          CONTENT=$(cat <<EOF
          🚨 **CD - EKS Access Failed**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}
          Trigger    : ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Auto' }}
          Runner     : Self-Hosted

          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}

          Status     : ❌ FAILED
          Reason     : Runner could not access the EKS cluster.

          Run:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          curl \
            -F "content=${CONTENT}" \
            "$DISCORD_WEBHOOK"

      # ---------------------------------------------------------
      # Verify Helm chart
      # ---------------------------------------------------------
      - name: Verify Helm chart
        run: |
          echo "Helm chart:"
          echo "${{ inputs.helm_chart_path }}"

          test -d "${{ inputs.helm_chart_path }}" || {
            echo "❌ Helm chart directory not found"
            exit 1
          }

          test -f "${{ inputs.helm_chart_path }}/Chart.yaml" || {
            echo "❌ Chart.yaml not found"
            exit 1
          }

          echo "✅ Helm chart found"

      # ---------------------------------------------------------
      # Helm dependencies
      # ---------------------------------------------------------
      - name: Update Helm dependencies
        run: |
          helm dependency update "${{ inputs.helm_chart_path }}"

      # ---------------------------------------------------------
      # Helm lint
      # ---------------------------------------------------------
      - name: Helm Lint
        run: |
          helm lint "${{ inputs.helm_chart_path }}"

      # ---------------------------------------------------------
      # Helm template validation
      # Image will come from values.yaml.
      # ---------------------------------------------------------
      - name: Helm Template
        run: |
          HELM_ARGS=(
            "${{ inputs.helm_release_name }}"
            "${{ inputs.helm_chart_path }}"
            "--namespace"
            "${{ inputs.kubernetes_namespace }}"
          )

          if [ -n "${{ inputs.helm_values_file }}" ]; then
            HELM_ARGS+=(
              "--values"
              "${{ inputs.helm_values_file }}"
            )
          fi

          echo "Rendering Helm templates..."

          helm template "${HELM_ARGS[@]}"

      # ---------------------------------------------------------
      # Helm Upgrade / Install
      #
      # No image override.
      # Helm uses image configured in values.yaml.
      # ---------------------------------------------------------
      - name: Helm Upgrade and Install
        id: helm_deploy
        run: |
          HELM_ARGS=(
            "${{ inputs.helm_release_name }}"
            "${{ inputs.helm_chart_path }}"
            "--namespace"
            "${{ inputs.kubernetes_namespace }}"
            "--create-namespace"
            "--install"
            "--wait"
            "--timeout"
            "10m"
          )

          if [ -n "${{ inputs.helm_values_file }}" ]; then
            HELM_ARGS+=(
              "--values"
              "${{ inputs.helm_values_file }}"
            )
          fi

          echo "Deploying Helm release..."

          echo "Release   : ${{ inputs.helm_release_name }}"
          echo "Namespace : ${{ inputs.kubernetes_namespace }}"
          echo "Chart     : ${{ inputs.helm_chart_path }}"

          helm upgrade "${HELM_ARGS[@]}"

      # ---------------------------------------------------------
      # Helm status
      # ---------------------------------------------------------
      - name: Helm Release Status
        run: |
          helm status "${{ inputs.helm_release_name }}" \
            --namespace "${{ inputs.kubernetes_namespace }}"

      # ---------------------------------------------------------
      # Helm history
      # ---------------------------------------------------------
      - name: Helm Release History
        if: always()
        run: |
          helm history "${{ inputs.helm_release_name }}" \
            --namespace "${{ inputs.kubernetes_namespace }}" \
            --max 10 || true

      # ---------------------------------------------------------
      # Show Kubernetes resources
      # ---------------------------------------------------------
      - name: Show deployment resources
        run: |
          kubectl get deploy,po,svc \
            --namespace "${{ inputs.kubernetes_namespace }}"

      # ---------------------------------------------------------
      # Final Deployment Report
      # ---------------------------------------------------------
      - name: Send Final Deployment Report
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DEPLOY_STATUS="PASSED"
            DEPLOY_EMOJI="✅"
          else
            DEPLOY_STATUS="FAILED"
            DEPLOY_EMOJI="❌"
          fi

          CONTENT=$(cat <<EOF
          🚀 **Helm Deployment Report**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}

          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}

          Helm Release : ${{ inputs.helm_release_name }}
          Helm Chart   : ${{ inputs.helm_chart_path }}

          Deployment : ${DEPLOY_EMOJI} ${DEPLOY_STATUS}

          Triggered By : ${{ github.actor }}
          Runner       : Self-Hosted

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          echo "Sending final deployment notification..."

          curl \
            -sS \
            --fail-with-body \
            -F "content=${CONTENT}" \
            "$DISCORD_WEBHOOK" || {
              echo "⚠️ Discord notification failed"
              echo "Deployment status remains: ${DEPLOY_STATUS}"
              exit 0
            }